name: Frontend CI

on:
  push:
    branches:
      - main

    paths:
      - 'frontend/**'

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Frontend Image
        run: |
          docker build \
          --build-arg VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }} \
          -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      - name: Trigger Frontend Render Deploy
        run: curl "${{ secrets.RENDER_FRONTEND_HOOK }}"